name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "v5"]

permissions:
  contents: read

env:
  # Fail on a stale or missing lockfile rather than silently re-resolving it.
  BUNDLE_FROZEN: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: RuboCop
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: '4.0'
        bundler-cache: true

    - run: bundle exec rake rubocop

    - name: Documentation coverage
      run: bundle exec rake yard:stats

  types:
    runs-on: ubuntu-latest
    name: Types (Steep + RBS)
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: '4.0'
        bundler-cache: true

    - name: Validate RBS signatures
      run: bundle exec rake rbs

    - name: Type check (Steep, strict)
      run: bundle exec rake steep

    - name: Type coverage gate (untyped-call baseline)
      run: bundle exec rake steep:coverage

    - name: Runtime signature check (RBS::Test)
      run: bundle exec rake rbs:test

  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby_version }}
    timeout-minutes: 15
    strategy:
      matrix:
        ruby_version: [ruby-head, '4.0', '3.4', '3.3']

    env:
      COVERAGE: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ${{ matrix.ruby_version }}
        bundler-cache: true
      continue-on-error: ${{ matrix.ruby_version == 'ruby-head' }}

    - run: bundle exec rake spec
      continue-on-error: ${{ matrix.ruby_version == 'ruby-head' }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: svyatov/sec_id
        files: ./coverage/coverage.xml
        fail_ci_if_error: true
      # Only upload coverage for the latest stable Ruby version
      if: ${{ matrix.ruby_version == '4.0' }}

  rails:
    runs-on: ubuntu-latest
    name: Rails ${{ matrix.rails_version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rails_version: ['7.2', '8.0', '8.1', head]

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails_version }}.gemfile
      # rails_head.gemfile tracks a git branch and ships no lockfile, so it must resolve on
      # every run; freezing it would pin the "head" job to a stale revision.
      BUNDLE_FROZEN: ${{ matrix.rails_version != 'head' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: '4.0'
        bundler-cache: true
      continue-on-error: ${{ matrix.rails_version == 'head' }}

    - run: bundle exec rake spec
      continue-on-error: ${{ matrix.rails_version == 'head' }}
